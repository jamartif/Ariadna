[workspace]
resolver = "2"
members = ["crates/ariadna-process", "crates/ariadna-git", "crates/ariadna-ai", "crates/ariadna-hosting", "src-tauri"]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/jamartif/Ariadna"

[workspace.dependencies]
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
command-group = { version = "5", features = ["with-tokio"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
directories = "6"
regex = "1"
dunce = "1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
zeroize = "1"
url = "2"
tauri-plugin-opener = "2"
async-trait = "0.1"
tempfile = "3"
proptest = "1"
ariadna-process = { path = "crates/ariadna-process" }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Los build scripts se compilan con optimización ligera: compila antes y evita
# que el Control de aplicaciones de algunos equipos bloquee el binario de depuración.
[profile.dev.build-override]
opt-level = 1
debug = false

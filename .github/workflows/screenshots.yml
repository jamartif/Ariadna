name: Capturas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
  # En una PR solo se generan y se suben como artefacto: así un cambio de UI
  # que rompa el renderizado se ve antes del merge. No se publica nada.
  pull_request:
    paths:
      - "Sources/App/**"
      - "scripts/render-snapshots.sh"
      - ".github/workflows/screenshots.yml"

# Por defecto, solo lectura. Únicamente el job `publish` pide escritura.
permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Capturas de la interfaz
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      # El código de una PR se ejecuta aquí (render-snapshots.sh, swift build):
      # sin credenciales guardadas y con un token de solo lectura.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false

      - name: Generar PNG
        run: bash scripts/render-snapshots.sh docs/screenshots

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: docs/screenshots/*.png
          if-no-files-found: error

  publish:
    name: Publicar en docs/screenshots
    needs: render
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Este job no ejecuta código del repositorio: solo copia los PNG y hace push.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Descargar capturas
        uses: actions/download-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: docs/screenshots

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Las capturas no han cambiado."
            exit 0
          fi
          git commit -m "Actualiza las capturas de la interfaz."
          git push origin HEAD:main

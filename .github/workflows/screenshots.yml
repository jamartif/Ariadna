name: Capturas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
  # En una PR solo se generan y se suben como artefacto: así un cambio de UI
  # que rompa el renderizado se ve antes del merge. No se publica nada.
  pull_request:
    paths:
      - "Sources/App/**"
      - "scripts/render-snapshots.sh"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  png:
    name: Capturas de la interfaz
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0

      - name: Generar PNG
        run: bash scripts/render-snapshots.sh docs/screenshots

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: docs/screenshots/*.png
          if-no-files-found: error

      - name: Publicar en docs/screenshots
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Las capturas no han cambiado."
            exit 0
          fi
          git commit -m "Actualiza las capturas de la interfaz."
          git push origin HEAD:main

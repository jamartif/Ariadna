name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
  # On a PR they are only rendered and uploaded as an artifact, so a UI change
  # that breaks rendering shows up before the merge. Nothing is published.
  pull_request:
    paths:
      - "Sources/App/**"
      - "scripts/render-snapshots.sh"
      - ".github/workflows/screenshots.yml"

# Read-only by default. Only the `publish` job asks for write access.
permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: UI screenshots
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      # A PR's code runs here (render-snapshots.sh, swift build): with no
      # persisted credentials and a read-only token.
      # The exact commit that triggered the workflow is used, not `main`: if
      # another push lands meanwhile, the screenshots still match this commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Render PNGs
        run: bash scripts/render-snapshots.sh docs/screenshots

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: docs/screenshots/*.png
          if-no-files-found: error

  publish:
    name: Publish to docs/screenshots
    needs: render
    # Only what was rendered from main is published (not a workflow_dispatch on another branch).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job runs no repository code: it only copies the PNGs and pushes.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: docs/screenshots

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "The screenshots have not changed."
            exit 0
          fi
          git commit -m "Update UI screenshots."
          git push origin HEAD:main

name: Capturas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"

permissions:
  contents: write

concurrency:
  group: screenshots-main
  cancel-in-progress: false

jobs:
  png:
    name: Capturas de la interfaz
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generar PNG
        run: bash scripts/render-snapshots.sh docs/screenshots

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error

      - name: Publicar en docs/screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Las capturas no han cambiado."
            exit 0
          fi
          git commit -m "Actualiza las capturas de la interfaz."
          git push origin HEAD:main

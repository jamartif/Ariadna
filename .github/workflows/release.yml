name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package Ariadna.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, ad-hoc sign and package
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/build-app.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ariadna-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/Ariadna-${version}.dmg \
            dist/Ariadna-${version}.zip \
            --title "Ariadna ${version}" \
            --notes "Universal binary (arm64 and x86_64) for macOS 15, ad-hoc signed. It is not notarized unless the workflow has the APPLE_* secrets configured.

          To open it on macOS 15: System Settings > Privacy & Security > Open Anyway.

          Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/Ariadna.app\`"
